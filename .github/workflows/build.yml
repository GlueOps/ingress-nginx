name: Build ingress-nginx controller

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build.yml
      - build.sh
      - image-exists.sh
      - test/**

permissions: {}

# Publishing runs queue up and never overlap: two at once could both see the tag
# as missing and one would overwrite the other's image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/glueops/ingress-nginx/controller
  UPSTREAM_REPO: https://github.com/chainguard-forks/ingress-nginx.git

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.find.outputs.tag }}
      sha: ${{ steps.find.outputs.sha }}
      version: ${{ steps.find.outputs.version }}
      newer_minor: ${{ steps.find.outputs.newer_minor }}
      build: ${{ steps.exists.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the newest controller-v1.15 tag
        id: find
        run: |
          set -euo pipefail
          refs=$(git ls-remote --tags --sort=v:refname "$UPSTREAM_REPO" 'refs/tags/controller-v*')
          # Git allows shell metacharacters in tag names, so only the exact shape is accepted.
          line=$(grep -E $'^[0-9a-f]{40}\trefs/tags/controller-v1\\.15\\.[0-9]+$' <<<"$refs" | tail -n1 || true)
          [[ -n $line ]] || { echo "::error::no controller-v1.15.N tag found upstream"; exit 1; }
          tag=${line##*refs/tags/}
          {
            echo "sha=${line%%$'\t'*}"
            echo "tag=$tag"
            echo "version=${tag#controller-}"
          } >>"$GITHUB_OUTPUT"
          newest=$(sed -nE $'s#^[0-9a-f]{40}\trefs/tags/controller-v([0-9]+\\.[0-9]+)\\.[0-9]+$#\\1#p' <<<"$refs" | sort -V | tail -n1)
          if [[ $newest != 1.15 ]]; then
            echo "newer_minor=$newest" >>"$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"

      # Pull requests always build, so a change to the pipeline is always tested.
      - name: Skip if this version is already published
        id: exists
        env:
          VERSION: ${{ steps.find.outputs.version }}
        run: |
          if [[ $GITHUB_EVENT_NAME != pull_request ]]; then
            rc=0
            ./image-exists.sh "$IMAGE:$VERSION" || rc=$?
            ((rc < 2)) || exit 1
            if ((rc == 0)); then
              echo "build=false" >>"$GITHUB_OUTPUT"
              echo "$IMAGE:$VERSION is already published; nothing to do." >>"$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "build=true" >>"$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # No registry access here: this job runs third-party source and pull request
    # code, so it only hands the tested image to the publish job.
    permissions:
      contents: read
    env:
      UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.discover.outputs.sha }}
      VERSION: ${{ needs.discover.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: ./build.sh
      - name: Smoke test
        run: test/smoke.sh "$IMAGE:$VERSION-$ARCH"
      - name: Save image
        run: docker save -o "image-$ARCH.tar" "$IMAGE:$VERSION-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [discover, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.discover.outputs.version }}
      UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
      UPSTREAM_SHA: ${{ needs.discover.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
      - name: Publish
        run: |
          set -euo pipefail
          rc=0
          ./image-exists.sh "$IMAGE:$VERSION" || rc=$?
          if ((rc != 1)); then
            echo "::error::$IMAGE:$VERSION already exists or could not be checked; refusing to overwrite"
            exit 1
          fi
          refs=()
          for arch in amd64 arm64; do
            docker load -i "image-$arch.tar"
            docker push "$IMAGE:$VERSION-$arch"
            refs+=("$IMAGE@$(docker buildx imagetools inspect "$IMAGE:$VERSION-$arch" --format '{{.Manifest.Digest}}')")
          done
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          cat >>"$GITHUB_STEP_SUMMARY" <<EOF
          Published \`$IMAGE:$VERSION@$digest\`

          Built from chainguard-forks/ingress-nginx \`$UPSTREAM_TAG\` (\`$UPSTREAM_SHA\`).

          Platform chart values (\`container_images.app_ingress_nginx.controller.image\`):

          \`\`\`yaml
          registry: ghcr.repo.gpkg.io
          repository: glueops/ingress-nginx/controller
          tag: $VERSION@$digest
          \`\`\`
          EOF

  notify:
    needs: [discover, build, publish]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RESULTS: ${{ join(needs.*.result, ' ') }}
      NEWER_MINOR: ${{ needs.discover.outputs.newer_minor }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report a failed scheduled build
        if: contains(env.RESULTS, 'failure') || contains(env.RESULTS, 'cancelled')
        run: |
          set -euo pipefail
          title="Scheduled ingress-nginx build is failing"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ -n $number ]]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$title" --body "The scheduled build failed: $RUN_URL

          Until it is fixed, new Chainguard releases are not being published. See the failure runbook in the README."
          fi
      # Its own issue, created once and never touched again, so it cannot
      # comment daily or bury a build failure.
      - name: Report a new upstream minor line
        if: env.NEWER_MINOR != ''
        run: |
          set -euo pipefail
          title="Chainguard has started a controller v$NEWER_MINOR line"
          number=$(gh issue list --state all --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\"))[0].number // empty")
          if [[ -z $number ]]; then
            gh issue create --title "$title" --body "This pipeline only builds controller-v1.15.N tags. Fixes may stop reaching the 1.15 line; decide whether to move (see AGENTS.md)."
          fi
